    <!-- Script para gerenciar cache e erros de carregamento (Evita tela branca) -->
    <script>
      // 1. Detectar erro de carregamento de scripts (ChunkLoadError)
      window.addEventListener('error', function(e) {
        if (e.target.tagName === 'SCRIPT') {
          console.log('Erro ao carregar script. Forçando recarregamento limpo...');
          window.location.reload(true); // Tenta forçar reload do servidor
        }
      }, true);

      // 2. Limpar Service Workers antigos de forma agressiva
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister().then(() => {
              console.log('Service Worker removido para evitar cache antigo.');
            });
          }
        });
        
        // Limpar caches do navegador
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (let name of names) caches.delete(name);
          });
        }
      }
    </script>
